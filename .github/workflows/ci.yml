name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, gd, exif, dom

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: PHP syntax
        run: find usr -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JS syntax
        run: |
          for f in $(find usr -name '*.js' ! -name '*.min.js'); do
            node --check "$f"
          done

      - name: Unit tests
        run: |
          php tests/test.php
          php tests/sanitizer-fallback.php
          php tests/repository.php
          php tests/migration.php
          php tests/schema-sqlite.php
          php tests/field-sync.php
          php tests/image-delete.php
          php tests/media-version.php
          php tests/media-lifetime.php
          php tests/media-gd.php
          php tests/media-command.php
          php tests/media-temp.php
          php tests/health-diagnostics.php
          php tests/maintenance-state.php
          for mode in scan-failure retry-image retry-fields retry-mixed retry-resync retry-repeat retry-finished retry-stale retry-empty retry-unfinished retry-other-job errors-page errors-stale resync-failure rebuild-sync-failure rebuild-success rebuild-batch rebuild-restart rebuild-resume rebuild-start-reuse rebuild-no-original rebuild-missing-original rebuild-conversion-failure stale-poll finished-poll delete-non-plugin delete-rollback lease-conflict; do
            php tests/maintenance-panel.php "$mode"
          done
          php tests/admin-workflow.php
          php tests/admin-panel.php
          for mode in get-maintenance post-no-token post-wrong-token post-array-token post-token-unavailable post-non-album post-foreign-album post-contributor-published post-batch-foreign post-cover-foreign post-batch-published post-cover-published; do
            php tests/admin-panel.php "$mode"
          done
          php tests/gallery-discovery.php
          php tests/gallery-performance.php
          php tests/upload-fallback.php
          php tests/theme-output.php
          node tests/admin-upload.cjs
          node tests/maintenance-client.cjs
          node --test tests/release-guards.cjs
          node tests/gallery.cjs
          node tests/data-saver.cjs
          node tests/gallery-loading.cjs
          node tests/gallery-navigation.cjs

      - name: Version consistency
        run: |
          THEME_V=$(sed -n 's/.*@version \([0-9][0-9.]*\).*/\1/p' usr/themes/InfinityTime/index.php | head -1)
          PLUGIN_V=$(sed -n "s/.*const VERSION = '\([0-9][0-9.]*\)'.*/\1/p" usr/plugins/InfinityTime/Plugin.php | head -1)
          REL_V=$(sed -n 's/.*"tag_name": "\([0-9][0-9.]*\)".*/\1/p' usr/themes/InfinityTime/releases.json | head -1)
          echo "theme=$THEME_V plugin=$PLUGIN_V releases=$REL_V"
          test "$THEME_V" = "$PLUGIN_V"
          test "$THEME_V" = "$REL_V"

      - name: Changelog has current version
        run: |
          THEME_V=$(sed -n 's/.*@version \([0-9][0-9.]*\).*/\1/p' usr/themes/InfinityTime/index.php | head -1)
          grep -q "^## $THEME_V$" usr/themes/InfinityTime/update.md

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      PLAYWRIGHT_BROWSER: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: 图库基础浏览器回归
        run: node tests/gallery-browser.cjs
      - name: 图库加载与历史导航回归
        if: ${{ !cancelled() }}
        run: node tests/gallery-loading-browser.cjs
      - name: 后台上传浏览器回归
        if: ${{ !cancelled() }}
        run: node tests/admin-upload.cjs --browser
      - name: 维护失败恢复浏览器回归
        if: ${{ !cancelled() }}
        run: node tests/maintenance-browser.cjs
      - name: 后台分页与批量整理浏览器回归
        if: ${{ !cancelled() }}
        run: node tests/admin-batch-browser.cjs

  typecho-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.4']
        typecho:
          - version: '1.2.1'
            ref: '206880ba714d80bfb0638aeacb49c58b8fb1b327'
          - version: '1.3.0'
            ref: 'e9f23304bf20c0c355ef1df9634d42148cbc53b5'
        database: [sqlite, mysql, pgsql]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: infinitytime_test
          MYSQL_ROOT_PASSWORD: integration-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pintegration-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: infinitytime_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d infinitytime_test"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: typecho/typecho
          ref: ${{ matrix.typecho.ref }}
          path: .typecho-test
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, pdo_mysql, mysqli, pdo_pgsql, pgsql
          coverage: none
      - name: PHP 代码与集成测试语法
        run: find usr tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: 真实 Typecho 数据库集成
        env:
          TYPECHO_ROOT: ${{ github.workspace }}/.typecho-test
          IT_DB_HOST: 127.0.0.1
          IT_DB_NAME: infinitytime_test
          IT_DB_USER: ${{ matrix.database == 'mysql' && 'root' || 'postgres' }}
          IT_DB_PASSWORD: integration-test-only
        run: |
          case '${{ matrix.database }}' in
            sqlite) adapters='Pdo_SQLite SQLite' ;;
            mysql) adapters='Pdo_Mysql Mysqli' ;;
            pgsql) adapters='Pdo_Pgsql Pgsql' ;;
          esac
          for adapter in $adapters; do
            php tests/typecho-integration.php "$adapter"
          done

  process-portability:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, fileinfo
          coverage: none
      - name: Windows 外部进程与临时资源回归
        shell: pwsh
        run: |
          php tests/media-command.php
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          php tests/media-temp.php
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
