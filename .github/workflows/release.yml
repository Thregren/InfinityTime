name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version consistency
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          THEME_V=$(sed -n 's/.*@version \([0-9][0-9.]*\).*/\1/p' usr/themes/InfinityTime/index.php | head -1)
          PLUGIN_V=$(sed -n "s/.*const VERSION = '\([0-9][0-9.]*\)'.*/\1/p" usr/plugins/InfinityTime/Plugin.php | head -1)
          REL_V=$(sed -n 's/.*"tag_name": "\([0-9][0-9.]*\)".*/\1/p' usr/themes/InfinityTime/releases.json | head -1)
          echo "tag=$TAG  theme=$THEME_V  plugin=$PLUGIN_V  releases=$REL_V"
          if [ "$TAG" != "$THEME_V" ] || [ "$TAG" != "$PLUGIN_V" ] || [ "$TAG" != "$REL_V" ]; then
            echo "::error::版本不一致：tag=$TAG theme=$THEME_V plugin=$PLUGIN_V releases=$REL_V"
            exit 1
          fi

      - name: Build archives
        run: |
          mkdir -p dist
          ( cd usr/themes && zip -qr "$GITHUB_WORKSPACE/dist/infinitytime-theme.zip" InfinityTime -x '*/.DS_Store' )
          ( cd usr/plugins && zip -qr "$GITHUB_WORKSPACE/dist/infinitytime-plugin.zip" InfinityTime -x 'InfinityTime/data/*' '*/.DS_Store' )
          ls -la dist/

      - name: Build release notes (changelog)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v sec="## $TAG" '
            $0 == sec { f=1; next }
            f && /^## / { exit }
            f { print }
          ' usr/themes/InfinityTime/update.md > dist/RELEASE_NOTES.md
          # 若未能抽取到当前版本小节，回退为整个 changelog
          if [ ! -s dist/RELEASE_NOTES.md ]; then cp usr/themes/InfinityTime/update.md dist/RELEASE_NOTES.md; fi
          echo '--- release notes ---'
          cat dist/RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "InfinityTime ${{ github.ref_name }}"
          files: |
            dist/infinitytime-theme.zip
            dist/infinitytime-plugin.zip
          body_path: dist/RELEASE_NOTES.md

  # 一次性授权范围：只允许目标仓库 main 的完整 CI 发布 1.14.2。
  release-1-14-2:
    if: >-
      github.event_name == 'workflow_run' &&
      github.repository == 'Thregren/InfinityTime' &&
      github.event.repository.fork == false &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-v1.14.2
      cancel-in-progress: false
    steps:
      - name: 在 checkout 前验证可信 main 和 CI 身份
        id: trusted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
            const repo = process.env.GITHUB_REPOSITORY;
            const assert = (ok, message) => { if (!ok) throw new Error(message); };
            assert(repo === 'Thregren/InfinityTime' && event.repository.full_name === repo && event.repository.fork === false, '目标仓库不匹配');
            // 仅输出诊断白名单；禁止输出令牌、完整响应头或原始响应正文。
            function formatApiError(method, endpoint, response, body, secrets = []) {
              const clean = value => {
                let text = String(value ?? '');
                for (const secret of secrets.filter(Boolean)) text = text.split(secret).join('[REDACTED]');
                return text.replace(/Bearer\s+[^\s,;]+/gi, 'Bearer [REDACTED]').replace(/[\r\n\x00-\x1f\x7f]/g, ' ');
              };
              const route = endpoint.startsWith('https://') ? new URL(endpoint).pathname : endpoint.split('?')[0];
              const details = ['x-ratelimit-remaining', 'x-ratelimit-reset', 'x-ratelimit-resource', 'retry-after']
                .map(name => `${name}=${clean(response.headers.get(name) ?? 'unknown').slice(0, 100)}`).join(' ');
              const message = typeof body?.message === 'string' ? clean(body.message).slice(0, 300) : 'unavailable';
              return `GitHub API ${clean(method)} ${clean(route)}: ${response.status}; ${details}; message=${message}`;
            }
            const get = async path => {
              const response = await fetch(`https://api.github.com/repos/${repo}${path}`, { signal: AbortSignal.timeout(30000), headers: { ...(path.startsWith('/actions/') ? {} : { Authorization: `Bearer ${process.env.GH_TOKEN}` }), Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } });
              if (!response.ok) {
                const errorBody = await response.json().catch(() => null);
                throw new Error(formatApiError('GET', path, response, errorBody, [process.env.GH_TOKEN]));
              }
              return response.json();
            };
            const main = await get('/git/ref/heads/main');
            const sha = main.object.sha;
            assert(main.object.type === 'commit' && /^[a-f0-9]{40}$/.test(sha), 'main SHA 无效');
            const id = event.workflow_run.id;
            assert(Number.isSafeInteger(id) && id > 0, 'CI run ID 无效');
            const run = await get(`/actions/runs/${id}`);
            for (const item of [event.workflow_run, run]) {
              assert(item.repository.full_name === repo && item.head_repository.full_name === repo, 'CI 仓库不匹配');
              assert(item.event === 'push' && item.head_branch === 'main' && item.status === 'completed' && item.conclusion === 'success', 'CI 不满足发布条件');
              assert(item.head_sha === sha, 'CI 不是当前 main');
              assert(item.name === 'CI' && item.path === '.github/workflows/ci.yml', 'CI path 不匹配');
            }
            assert(run.id === id && run.workflow_id === event.workflow_run.workflow_id, 'CI run 不匹配');
            const workflow = await get(`/actions/workflows/${run.workflow_id}`);
            assert(workflow.id === run.workflow_id && workflow.path === '.github/workflows/ci.yml' && workflow.state === 'active', 'CI workflow 不匹配');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${sha}\n`);
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE

      - name: Checkout 已验证的精确 main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.trusted.outputs.sha }}
          persist-credentials: false

      - name: 离线发布 guard 回归
        run: node --test tests/release-guards.cjs

      - name: 验证、打包并发布唯一授权版本
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-guard.cjs
